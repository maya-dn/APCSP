<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP CSP Exam Study Plan</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const DAYS = [
      {
        date: "May 5",
        dow: "Tuesday",
        label: "Day 1",
        title: "Algorithms & Programming I",
        tag: "30–35% of exam",
        desc: "The single biggest topic on the exam. Today you're building the foundation AND starting to connect it to your actual tracker.py code.",
        tasks: [
          "Review the CSP Reference Sheet — know DISPLAY, REPEAT, IF/ELSE, PROCEDURE, and all list operations cold",
          "AP Classroom → complete Big Idea 3 Topic Questions (algorithms, sequencing, selection, iteration)",
          "Practice tracing code: work through 10–15 MCQs on loops, conditionals, and procedure calls",
          "Make a personal cheat sheet of common patterns: swap, accumulator, min/max, linear search",
          "tracker.py — Code Read: Open tracker.py and read every function. For each one, write in your own words what it does, what inputs it takes, and what it returns (or changes)",
          "tracker.py — Trace show_tasks(): Manually trace the for loop in show_tasks() with a tasks list of 3 items — write out what prints on each iteration",
          "tracker.py — Identify structures: Mark every example of sequence, selection, and iteration in tracker.py. Count: how many if/elif/else blocks? how many loops?",
        ],
      },
      {
        date: "May 6",
        dow: "Wednesday",
        label: "Day 2",
        title: "Algorithms & Programming II + FRQ Row 5",
        tag: "search, procedures, FRQ algorithm row",
        desc: "Deepen your understanding of procedures and algorithms — then practice writing about them using find_tasks() as your example. Row 5 of the FRQ rubric is literally asking about this.",
        tasks: [
          "Study binary search vs. linear search — know when each applies and compare efficiency",
          "Practice robot/grid movement questions (extremely common on the MCQ)",
          "AP Classroom → timed set of 15 MCQs on procedures, parameters, and return values",
          "Review how to identify and correct errors: logic errors, syntax errors, runtime errors, overflow",
          "tracker.py — Analyze find_tasks(): Identify the sequence (build results list), selection (the if statement), and iteration (the for loop). Write one sentence describing each of the three",
          "tracker.py — Trace find_tasks(): Call find_tasks('homework') with tasks = [{'name':'do homework','done':False}, {'name':'clean room','done':True}]. Trace every line and write what results holds at the end",
          "tracker.py — FRQ Row 5 Practice: Write a full answer to this prompt: 'Describe what your identified procedure does and explain how it uses sequence, selection, and iteration to accomplish its purpose.' Use find_tasks() as your procedure — aim for 3–4 sentences",
          "tracker.py — Error Analysis: What would happen if you called find_tasks('') with an empty string? Trace it. What does it return and why?",
        ],
      },
      {
        date: "May 7",
        dow: "Thursday",
        label: "Day 3",
        title: "Data Representation & Binary",
        tag: "17–22% of exam",
        desc: "Binary conversions show up every single year — don't lose free points here.",
        tasks: [
          "Master binary ↔ decimal conversions (do 10+ by hand until it's automatic)",
          "Review data compression: lossy vs. lossless, overflow errors, round-off errors",
          "Study storage fundamentals: bits, bytes, ASCII/Unicode, RGB pixel representation",
          "AP Classroom → complete Big Idea 2 Topic Questions on data representation & analysis",
          "tracker.py — Data types deep-dive: List every variable in tracker.py and its data type (string, integer, boolean, list, dictionary). Notice how a dictionary holds mixed types",
          "tracker.py — FRQ Row 2 Practice: Write an answer to this prompt: 'Identify a list in your program and describe what each element of the list represents.' Use the tasks list — describe what a single element (a dictionary) stores and means in the context of the program",
        ],
      },
      {
        date: "May 8",
        dow: "Friday",
        label: "Day 4",
        title: "Data Analysis + Lists + FRQ Rows 2 & 3",
        tag: "lists, abstraction, managing complexity",
        desc: "Lists are the centerpiece of both the data unit and your FRQ rubric. Rows 2 and 3 are entirely about your tasks list — get comfortable explaining it.",
        tasks: [
          "Practice questions about extracting info from data: filtering, sorting, finding patterns in datasets",
          "Review list operations in pseudocode: INSERT, APPEND, REMOVE, LENGTH, indexing",
          "Study metadata, data cleaning, and the limitations of data-driven conclusions",
          "Do 10 mixed MCQs across data + algorithm topics to reinforce connections",
          "tracker.py — List operations: Trace what happens to the tasks list when you call add_task('read'), then complete_task(1), then add_task('sleep'). Write the state of tasks after each call",
          "tracker.py — FRQ Row 2 Practice: Write a full answer to: 'Describe what the data contained in your list represents and how it is being used in your program.' Focus on both keys in the dictionary: 'name' and 'done'",
          "tracker.py — FRQ Row 3 Practice: Write a full answer to: 'Explain how the list manages complexity in your program. Would your program work without the list?' Think about: what if you had 50 tasks stored as 50 separate variables — explain why the list solves this",
          "tracker.py — Complexity check: Rewrite show_tasks() mentally without the list — using task1, task2, task3 variables. Write 2 sentences about why that approach doesn't scale",
        ],
      },
      {
        date: "May 9",
        dow: "Saturday",
        label: "Day 5",
        title: "The Internet & Computing Systems",
        tag: "11–15% of exam",
        desc: "Lighter weight but the questions are usually straightforward — easy points if you know the material.",
        tasks: [
          "Review how the internet works: packets, TCP/IP, DNS, HTTP/HTTPS, routing",
          "Study fault tolerance, redundancy, and how the internet handles failures",
          "Understand the difference between the internet and the World Wide Web",
          "AP Classroom → complete Big Idea 4 Topic Questions on computing systems & networks",
          "tracker.py — FRQ Row 1 Practice: Write a full answer to: 'Describe the overall purpose of your program. What problem does it solve or what does it allow a user to do?' Be specific — mention the user interaction through the menu, task management features, and what the program enables",
          "tracker.py — Purpose vs. function: The rubric distinguishes 'purpose' (why it exists, the problem it solves) from 'function' (what it does step by step). Write one sentence for each using tracker.py",
        ],
      },
      {
        date: "May 10",
        dow: "Sunday",
        label: "Day 6",
        title: "Impact of Computing + FRQ Row 6",
        tag: "21–26% of exam + testing",
        desc: "Second largest topic. These questions test concepts, not code. Then do Row 6 — the testing row is often left blank on real exams and costs students a full point.",
        tasks: [
          "Study digital divide, bias in algorithms, crowdsourcing, and citizen science",
          "Review cybersecurity: PII, phishing, encryption (symmetric vs. public key), certificates",
          "Know legal/ethical issues: Creative Commons, open-source, copyright, safe harbor",
          "AP Classroom → complete Big Idea 5 Topic Questions on computing innovations & impact",
          "tracker.py — FRQ Row 6 Test Case 1: Describe a call to find_tasks() that tests a task that EXISTS. Write: what argument you pass, what the expected output is, and why this tests correct behavior",
          "tracker.py — FRQ Row 6 Test Case 2: Describe a call to find_tasks() that tests a task that does NOT exist. Write: what argument you pass, what the expected output is, and why this is a different condition",
          "tracker.py — FRQ Row 6 Full Practice: Write the complete Row 6 answer combining both test cases in the format the rubric expects — two separate conditions, two expected outputs, explain what each one tests",
          "tracker.py — Edge case thinking: What happens in complete_task() if you pass 0? Pass a number larger than the list length? Trace both — write what the code does and whether that's the right behavior",
        ],
      },
      {
        date: "May 11",
        dow: "Monday",
        label: "Day 7",
        title: "Full Practice Exam + FRQ Timed Run",
        tag: "simulate real conditions",
        desc: "The most important day of prep. Treat this like the actual exam — timed MCQ section, then a timed written response using your tracker.py PPR.",
        tasks: [
          "Take a full 70-question timed practice exam (120 min) — AP Classroom has one your teacher can release",
          "Score yourself and identify your weakest Big Ideas",
          "Review every question you got wrong — write down WHY you missed it",
          "Make a targeted hit-list of concepts to revisit tomorrow",
          "tracker.py — Timed FRQ Run: Set a timer for 30 minutes. Answer all 6 rubric rows back-to-back using only your PPR screenshots (no looking at the full code file) — simulate real exam conditions",
          "tracker.py — Self-score: After the timed run, use the AP rubric descriptions to score each of your 6 responses. Mark which rows felt weakest — those are your targets for Day 8",
        ],
      },
      {
        date: "May 12",
        dow: "Tuesday",
        label: "Day 8",
        title: "Weak Spots + FRQ Deep Drill",
        tag: "target your gaps + all 6 rubric rows",
        desc: "Patch your MCQ gaps and go deep on every FRQ row. This is your most important written response day — tracker.py is your text, the rubric is your guide.",
        tasks: [
          "Revisit your weak MCQ areas from yesterday's practice exam with focused topic review",
          "Know the 6 rubric rows by heart: (1) purpose/function, (2) data in list, (3) managing complexity, (4) procedure + parameter, (5) algorithm with seq/sel/iter, (6) two test cases",
          "tracker.py — Row 4 Deep Dive: Write a full answer to: 'Describe what your identified procedure does and explain how calls to it contribute to the overall functionality of the program.' Use find_tasks() — name the parameter keyword, explain what it does, and explain how main() calls it",
          "tracker.py — Rewrite your weakest rows: Look at your self-scored Day 7 responses. Rewrite the 2–3 rows that felt shakiest from scratch, without looking at your previous attempt",
          "tracker.py — Trace complete_task() in detail: Walk through complete_task(2) with a 3-task list. Write the value of index, confirm the condition check, and describe what tasks[1] looks like before and after",
          "tracker.py — Explain abstraction: How does find_tasks() hide complexity from the rest of the program? What would main() look like if find_tasks() didn't exist and that logic was inline? Write 3 sentences",
          "tracker.py — Full FRQ Practice (timed 45 min): Write all 6 rows again, this time polishing your language. Aim for clear, specific answers with no vague phrases like 'it does stuff' — name variables, describe exact behavior",
          "Check PPR screenshots: confirm your code screenshots are in Bluebook and clearly show the tasks list and find_tasks() — these are what the grader sees",
        ],
      },
      {
        date: "May 13",
        dow: "Wednesday",
        label: "Day 9",
        title: "Final Review + Exam Logistics",
        tag: "night before",
        desc: "Light review only — you're not learning new material, you're sharpening what you know.",
        tasks: [
          "Quick 20-question sprint across all Big Ideas to stay sharp",
          "Re-read the CSP Reference Sheet one final time",
          "Confirm Bluebook is installed and working — complete the digital practice if you haven't",
          "tracker.py — Final read-through: Read tracker.py one more time top to bottom. No notes, just absorb it. You should be able to answer any FRQ question about it without looking",
          "tracker.py — Talk it out loud: For each function in tracker.py, say out loud what it does, its parameters, and what would happen with a normal vs. edge-case input. Saying it out loud is different from reading it",
          "Pack: charged laptop, student ID, water, snacks. Get to bed early.",
        ],
      },
      {
        date: "May 14",
        dow: "Thursday",
        label: "EXAM DAY",
        title: "AP CSP Exam — 12:00 PM",
        tag: "you've got this",
        desc: "This is it. Light review in the morning, arrive early, stay calm.",
        tasks: [
          "Light review only — skim your cheat sheets and the reference sheet over breakfast",
          "Skim your written FRQ notes one last time — remind yourself of the 6 rubric rows and your key answers",
          "Arrive early, stay calm, read every question carefully",
          "Section I (MCQ): 70 questions, 120 min — flag tough ones and come back",
          "Section II (Written Response): 2 questions about your Create Task — use specific variable names and describe exact behavior, not vague descriptions",
        ],
      },
    ];

    const RESOURCES = [
      { name: "AP Classroom", url: "https://apclassroom.collegeboard.org", note: "Official topic questions, progress checks, and full practice exams" },
      { name: "CSP Reference Sheet (PDF)", url: "https://apcentral.collegeboard.org/media/pdf/ap-computer-science-principles-exam-reference-sheet.pdf", note: "The pseudocode reference you'll have on exam day" },
      { name: "Past Exam Questions — AP Central", url: "https://apcentral.collegeboard.org/courses/ap-computer-science-principles/exam/past-exam-questions", note: "Released MCQs + written response samples with scoring rubrics" },
      { name: "Khan Academy — AP CSP", url: "https://www.khanacademy.org/computing/ap-computer-science-principles", note: "Free videos and exercises for every unit" },
      { name: "APCSExamPrep.com", url: "https://www.apcsexamprep.com", note: "Free 70-question practice exams and Big Idea study guides" },
      { name: "Bluebook", url: "https://bluebook.collegeboard.org", note: "Install this and do the digital practice before exam day" },
    ];

    function StudyPlan() {
      const [checked, setChecked] = useState({});
      const [openDays, setOpenDays] = useState({ 0: true });

      const toggle = (d, t) => {
        const k = `${d}-${t}`;
        setChecked(p => ({ ...p, [k]: !p[k] }));
      };
      const toggleDay = (d) => setOpenDays(p => ({ ...p, [d]: !p[d] }));

      const total = DAYS.reduce((s, d) => s + d.tasks.length, 0);
      const done = Object.values(checked).filter(Boolean).length;
      const pct = Math.round((done / total) * 100);

      return (
        <div style={{
          fontFamily: "Georgia, 'Times New Roman', serif",
          background: "#fff",
          color: "#1a1a1a",
          minHeight: "100vh",
          padding: "32px 20px 64px",
          lineHeight: 1.7,
        }}>
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Source+Code+Pro:wght@400;500&display=swap');
            * { box-sizing: border-box; margin: 0; padding: 0; }
            a { color: #1a6dd4; }
            a:hover { color: #0f4d96; }
          `}</style>

          <div style={{ maxWidth: 640, margin: "0 auto" }}>

            <h1 style={{
              fontFamily: "'Source Serif 4', Georgia, serif",
              fontSize: 30, fontWeight: 700, lineHeight: 1.25,
              marginBottom: 6, color: "#111",
            }}>
              AP CSP Exam Study Plan
            </h1>
            <p style={{
              fontSize: 15, color: "#666", marginBottom: 24,
              fontFamily: "'Source Serif 4', Georgia, serif",
            }}>
              May 5 – May 14, 2026 · 10 days · Exam is Thursday 5/14 at 12 PM
            </p>

            <hr style={{ border: "none", borderTop: "1px solid #e5e5e5", marginBottom: 24 }} />

            <p style={{ fontSize: 15, marginBottom: 10, fontFamily: "'Source Serif 4', Georgia, serif" }}>
              The exam has two parts: <strong>Section I</strong> is 70 multiple-choice questions in 120 minutes (70% of your score),
              and <strong>Section II</strong> is 2 written response questions about your Create Performance Task in ~60 minutes (30% of your score).
              The whole thing is digital in Bluebook.
            </p>
            <p style={{ fontSize: 15, marginBottom: 24, fontFamily: "'Source Serif 4', Georgia, serif", color: "#555" }}>
              Check off tasks as you go. Tap a day to expand it.
            </p>

            {/* Past Results */}
            <div style={{
              background: "#f8f9fa", border: "1px solid #e5e5e5", borderRadius: 6,
              padding: "16px 20px", marginBottom: 28,
            }}>
              <h3 style={{
                fontSize: 13, fontWeight: 600, textTransform: "uppercase",
                letterSpacing: "0.5px", color: "#888", marginBottom: 12,
                fontFamily: "'Source Code Pro', monospace",
              }}>
                Past Results
              </h3>

              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 16, fontWeight: 600, color: "#1a1a1a", fontFamily: "'Source Serif 4', Georgia, serif" }}>
                    2021 Practice Exam MCQ
                  </div>
                  <div style={{ fontSize: 13, color: "#888", marginTop: 2 }}>
                    AP Classroom · Completed Tue, Apr 21
                  </div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div style={{
                    fontSize: 28, fontWeight: 700, color: "#1a1a1a",
                    fontFamily: "'Source Code Pro', monospace",
                    lineHeight: 1,
                  }}>
                    56<span style={{ color: "#aaa", fontWeight: 400, fontSize: 18 }}>/70</span>
                  </div>
                  <div style={{
                    fontSize: 13, color: "#666", marginTop: 2,
                    fontFamily: "'Source Code Pro', monospace",
                  }}>80%</div>
                </div>
              </div>

              <div style={{ marginTop: 12 }}>
                <div style={{ height: 6, background: "#e0e0e0", borderRadius: 3, overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: "80%",
                    background: "#4caf50",
                    borderRadius: 3,
                  }} />
                </div>
                <div style={{
                  display: "flex", justifyContent: "space-between",
                  fontSize: 11, color: "#aaa", marginTop: 4,
                  fontFamily: "'Source Code Pro', monospace",
                }}>
                  <span>14 missed — review these topics during the plan</span>
                  <span>goal: 63+ (90%)</span>
                </div>
              </div>
            </div>

            {/* Overall progress */}
            <div style={{
              background: "#f8f9fa", border: "1px solid #e5e5e5", borderRadius: 6,
              padding: "12px 16px", marginBottom: 28,
            }}>
              <div style={{
                display: "flex", justifyContent: "space-between", fontSize: 13, color: "#888", marginBottom: 6,
                fontFamily: "'Source Code Pro', monospace",
              }}>
                <span>study plan progress</span>
                <span>{done}/{total} tasks · {pct}%</span>
              </div>
              <div style={{ height: 6, background: "#e0e0e0", borderRadius: 3, overflow: "hidden" }}>
                <div style={{
                  height: "100%", width: `${pct}%`,
                  background: pct === 100 ? "#4caf50" : "#1a6dd4",
                  borderRadius: 3, transition: "width 0.3s ease",
                }} />
              </div>
            </div>

            {/* Days */}
            {DAYS.map((day, di) => {
              const isOpen = openDays[di];
              const dayDone = day.tasks.filter((_, ti) => checked[`${di}-${ti}`]).length;
              const dayTotal = day.tasks.length;
              const allDone = dayDone === dayTotal;
              const isExam = di === 9;

              return (
                <div key={di} style={{
                  borderBottom: "1px solid #eee",
                  paddingBottom: isOpen ? 16 : 0,
                  marginBottom: isOpen ? 16 : 0,
                }}>
                  <button
                    onClick={() => toggleDay(di)}
                    style={{
                      width: "100%", padding: "12px 0",
                      display: "flex", alignItems: "baseline", gap: 12,
                      background: "transparent", border: "none", color: "#1a1a1a",
                      cursor: "pointer", textAlign: "left",
                      fontFamily: "'Source Serif 4', Georgia, serif",
                    }}
                  >
                    <span style={{
                      fontSize: 12, color: isOpen ? "#1a6dd4" : "#aaa",
                      fontFamily: "'Source Code Pro', monospace",
                      fontWeight: 500, flexShrink: 0, width: 40,
                      transition: "color 0.15s",
                    }}>
                      {isOpen ? "▾" : "▸"} {di + 1}.
                    </span>

                    <div style={{ flex: 1 }}>
                      <span style={{
                        fontSize: 17, fontWeight: 600, color: isExam ? "#c62828" : "#1a1a1a",
                      }}>
                        {day.title}
                      </span>
                      {allDone && <span style={{ fontSize: 13, color: "#4caf50", marginLeft: 8 }}>✓</span>}
                      <div style={{
                        fontSize: 13, color: "#999", marginTop: 1,
                        fontFamily: "'Source Code Pro', monospace",
                      }}>
                        {day.dow}, {day.date} · {day.tag} · {dayDone}/{dayTotal}
                      </div>
                    </div>
                  </button>

                  {isOpen && (
                    <div style={{ paddingLeft: 52 }}>
                      <p style={{
                        fontSize: 14, color: "#666", marginBottom: 12,
                        fontFamily: "'Source Serif 4', Georgia, serif",
                        fontStyle: "italic",
                      }}>
                        {day.desc}
                      </p>
                      {day.tasks.map((task, ti) => {
                        const isDone = checked[`${di}-${ti}`];
                        return (
                          <label key={ti} style={{
                            display: "flex", gap: 10, padding: "4px 0",
                            cursor: "pointer", alignItems: "flex-start",
                          }}>
                            <input
                              type="checkbox"
                              checked={!!isDone}
                              onChange={() => toggle(di, ti)}
                              style={{
                                width: 15, height: 15, marginTop: 4, flexShrink: 0,
                                accentColor: "#1a6dd4",
                              }}
                            />
                            <span style={{
                              fontSize: 14,
                              color: isDone ? "#bbb" : "#333",
                              textDecoration: isDone ? "line-through" : "none",
                              fontFamily: "'Source Serif 4', Georgia, serif",
                              transition: "color 0.15s",
                            }}>
                              {task}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}

            <hr style={{ border: "none", borderTop: "1px solid #e5e5e5", margin: "28px 0" }} />

            {/* Resources */}
            <h2 style={{
              fontSize: 20, fontWeight: 700, marginBottom: 12,
              fontFamily: "'Source Serif 4', Georgia, serif",
            }}>
              Resources
            </h2>
            {RESOURCES.map((r, i) => (
              <div key={i} style={{ marginBottom: 10 }}>
                <a href={r.url} target="_blank" rel="noopener noreferrer" style={{
                  fontSize: 15, fontWeight: 600,
                  fontFamily: "'Source Serif 4', Georgia, serif",
                }}>{r.name}</a>
                <span style={{ fontSize: 14, color: "#888", marginLeft: 8 }}>— {r.note}</span>
              </div>
            ))}

            <hr style={{ border: "none", borderTop: "1px solid #e5e5e5", margin: "28px 0" }} />

            {/* Exam tips */}
            <h2 style={{
              fontSize: 20, fontWeight: 700, marginBottom: 12,
              fontFamily: "'Source Serif 4', Georgia, serif",
            }}>
              Exam Day Reminders
            </h2>
            <div style={{
              fontSize: 15, color: "#333", lineHeight: 1.8,
              fontFamily: "'Source Serif 4', Georgia, serif",
            }}>
              <p>Section I is 70 MCQs in 120 minutes — about 1 minute 42 seconds each. Flag the hard ones and come back. Section II gives you about 60 minutes for 2 written response questions about your Create Task, using only your Personalized Project Reference (not your full code).</p>
              <p style={{ marginTop: 10 }}>There's no penalty for guessing, so never leave a question blank. Multi-select questions are marked and ask for two correct answers. The exam is fully digital in Bluebook — make sure it's installed and tested beforehand.</p>
            </div>

            <p style={{
              fontSize: 13, color: "#ccc", marginTop: 40, textAlign: "center",
              fontFamily: "'Source Code Pro', monospace",
            }}>
              last updated may 6, 2026
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<StudyPlan />);
  </script>
</body>
</html>
